<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMR Member Directory</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;min-height:100vh;background:#f3f0fa;padding-bottom:48px}
.hdr{background:linear-gradient(to right,#7B2FF7,#6A1FE0);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hdr h1{color:#fff;font-size:18px;font-weight:700}
.hdr small{color:rgba(255,255,255,0.75);font-size:12px;display:block}
.hdr-r{display:flex;gap:8px;align-items:center}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:500}
.btn-w{background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.3)}
.btn-p{background:#7B2FF7;color:#fff}
.btn-g{background:#f1f5f9;color:#555}
.btn-d{background:rgba(239,68,68,0.1);color:#f87171;border:1px solid rgba(239,68,68,0.2)}
.btn-s{padding:5px 12px;font-size:12px}
.btn-fb{background:#1877F2;color:#fff;display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;border:none;cursor:pointer;font-family:'Sarabun',sans-serif;font-size:14px;font-weight:600;width:100%}
.admin-bar{background:rgba(123,47,247,0.08);border-bottom:1px solid rgba(123,47,247,0.15);padding:8px 18px;display:none;gap:8px;align-items:center;flex-wrap:wrap}
.admin-bar.on{display:flex}
.toolbar{padding:12px 18px 0;display:flex;gap:8px;flex-wrap:wrap}
.si{position:relative;flex:1;min-width:180px}
.si input{width:100%;background:rgba(255,255,255,0.85);border:1px solid rgba(123,47,247,0.2);border-radius:10px;padding:9px 14px;font-size:13px;font-family:'Sarabun',sans-serif;color:#333;outline:none}
.si input:focus{border-color:#7B2FF7}
.filters{padding:8px 18px 0;display:flex;gap:6px;flex-wrap:wrap}
.fb{padding:4px 14px;border-radius:20px;border:none;font-family:'Sarabun',sans-serif;font-size:12px;font-weight:600;cursor:pointer;opacity:.6;transition:all .15s}
.fb.on{opacity:1;transform:scale(1.05)}
.container{padding:12px 18px}
.tier-section{margin-bottom:8px}
.card{position:relative;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.18)}
.card.promoted-1:hover,.card.promoted-2:hover{box-shadow:0 8px 24px rgba(255,200,0,0.55),0 0 10px 3px rgba(255,180,0,0.35)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-initial{font-weight:700;color:rgba(255,255,255,0.2);position:relative;z-index:1}
.card-initial.dark{color:rgba(0,0,0,0.12)}
.overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.62));z-index:2}
.card-name{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-sub{color:rgba(255,255,255,0.78);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tier-tag{position:absolute;top:5px;left:5px;color:#fff;font-size:8px;padding:1px 6px;border-radius:8px;font-weight:500;background:rgba(0,0,0,0.28);z-index:3}
.tier-tag-promoted{background:linear-gradient(135deg,#FFD700,#FFA500)!important;color:#fff!important;font-weight:700!important;box-shadow:0 1px 6px rgba(255,200,0,0.55);text-shadow:0 1px 2px rgba(0,0,0,0.35)}
.card-edit{position:absolute;top:5px;right:5px;background:rgba(0,0,0,0.45);color:#fff;border:none;border-radius:5px;padding:2px 6px;font-size:10px;cursor:pointer;display:none;z-index:4}
.promoted-1{background:#7B2FF7}.promoted-2{background:#6A1FE0}
.card.promoted-1,.card.promoted-2{box-shadow:0 0 18px 4px rgba(255,210,0,0.45),0 0 6px 1px rgba(255,180,0,0.3)}
.vip-1{background:#F5A623}.vip-2{background:#E09620}
.premium-1{background:#E91E8C}.premium-2{background:#D01578}
.member-1{background:#C8C0E8}.member-2{background:#B8AEDD}
.row-tier{display:flex;gap:7px;flex-wrap:wrap;width:100%}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.md{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.md-h{padding:16px 20px 12px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}
.md-h h3{font-size:15px;font-weight:700}
.md-cl{background:none;border:none;font-size:18px;cursor:pointer;color:#bbb}
.md-b{padding:16px 20px}
.md-f{padding:12px 20px;border-top:1px solid #f0f0f0;display:flex;gap:8px;justify-content:flex-end}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgr{display:flex;flex-direction:column;gap:4px}
.fgr.full{grid-column:1/-1}
label{font-size:12px;color:#888;font-weight:500}
input[type=text],input[type=tel],input[type=password],textarea{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;font-family:'Sarabun',sans-serif;color:#333;outline:none}
input:focus,textarea:focus{border-color:#7B2FF7}
textarea{resize:vertical;min-height:54px}
.pu{border:2px dashed #d8b4fe;border-radius:10px;padding:12px;text-align:center;cursor:pointer;position:relative}
.pu:hover{border-color:#7B2FF7}
.pu-img{width:72px;height:96px;border-radius:8px;object-fit:cover;margin:0 auto 6px;display:block;border:2px solid #7B2FF7}
.pu-ph{width:72px;height:96px;border-radius:8px;background:#f3f0fa;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:28px}
.pu input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.xg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.xs{border:2px dashed #d8b4fe;border-radius:8px;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden}
.xs:hover{border-color:#7B2FF7}
.xs img{width:100%;height:100%;object-fit:cover}
.xs input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.xs-rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,0.55);border:none;border-radius:50%;width:18px;height:18px;color:#fff;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:2}
.xs:hover .xs-rm{display:flex}
.tr-g{display:flex;gap:6px;flex-wrap:wrap}
.tr-o{padding:4px 12px;border-radius:20px;border:1px solid #e2e8f0;cursor:pointer;font-size:12px;font-weight:600;background:#f8fafc;color:#888}
.tr-Promoted{background:rgba(123,47,247,0.1);color:#7B2FF7;border-color:#7B2FF7}
.tr-VIP{background:rgba(245,166,35,0.1);color:#b45309;border-color:#F5A623}
.tr-Premium{background:rgba(233,30,140,0.1);color:#E91E8C;border-color:#E91E8C}
.tr-Member{background:rgba(200,192,232,0.3);color:#6d5fad;border-color:#C8C0E8}
.qr-box{flex:1;background:#f3f0fa;border-radius:10px;padding:8px;text-align:center}
.qr-box img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.toast{position:fixed;bottom:20px;right:20px;background:#1a1a2e;border-radius:8px;padding:10px 16px;font-size:13px;color:#fff;z-index:999;transform:translateY(70px);opacity:0;transition:all .3s}
.toast.on{transform:translateY(0);opacity:1}
.toast.ok{border-left:3px solid #4ade80}
.toast.er{border-left:3px solid #f87171}
.empty{text-align:center;padding:48px;color:#7B2FF7;opacity:.4}
.member-badge{background:rgba(74,222,128,0.15);color:#16a34a;border:1px solid rgba(74,222,128,0.3);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
</style>
</head>
<body>

<div class="hdr">
  <div><h1>MMR Members</h1><small id="cntLbl">กำลังโหลด...</small></div>
  <div class="hdr-r">
    <span id="memberBadge" style="display:none" class="member-badge">👤 <span id="memberName"></span></span>
    <button id="btnLoginFB" class="btn btn-w btn-s" onclick="loginFacebook()" style="display:none">🔵 Login FB</button>
    <button id="btnLogout" class="btn btn-w btn-s" onclick="logoutMember()" style="display:none">ออก</button>
  </div>
</div>

<button id="btnAdmin" onclick="toggleAdmin()" style="position:fixed;bottom:20px;right:20px;z-index:200;width:40px;height:40px;border-radius:50%;border:none;background:rgba(200,192,232,0.25);color:rgba(180,170,210,0.5);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s">🌸</button>

<div class="admin-bar" id="adminBar">
  <button class="btn btn-p btn-s" onclick="openAdd()">+ เพิ่มสมาชิก</button>
  <button class="btn btn-s" style="background:rgba(233,30,140,0.1);color:#E91E8C;border:1px solid rgba(233,30,140,0.2)" onclick="doReload()">🔄 รีเฟรช</button>
  <button class="btn btn-g btn-s" style="margin-left:auto" onclick="logoutAdmin()">ออก</button>
</div>

<div class="toolbar">
  <div class="si"><input type="text" id="sq" placeholder="ค้นหาชื่อ จังหวัด อาชีพ..." oninput="draw()"></div>
</div>
<div class="filters">
  <button class="fb on" style="background:#7B2FF7;color:#fff" onclick="setF('',this)">ทั้งหมด</button>
  <button class="fb" style="background:rgba(123,47,247,0.15);color:#7B2FF7" onclick="setF('Promoted',this)">Promoted</button>
  <button class="fb" style="background:rgba(245,166,35,0.15);color:#b45309" onclick="setF('VIP',this)">VIP</button>
  <button class="fb" style="background:rgba(233,30,140,0.15);color:#E91E8C" onclick="setF('Premium',this)">Premium</button>
  <button class="fb" style="background:rgba(200,192,232,0.3);color:#6d5fad" onclick="setF('Member',this)">Member</button>
</div>

<div class="container" id="mainContainer">
  <div class="empty">⏳ กำลังโหลด...</div>
</div>

<!-- Admin Login -->
<div class="ov" id="ovLogin">
  <div class="md" style="max-width:300px">
    <div class="md-h"><h3>Admin Login</h3><button class="md-cl" onclick="closeLogin()">×</button></div>
    <div class="md-b">
      <div style="color:#aaa;font-size:12px;margin-bottom:12px">เฉพาะผู้ดูแลระบบเท่านั้น</div>
      <div class="fgr" style="margin-bottom:10px"><label>รหัสผ่าน</label><input type="password" id="pwIn" onkeydown="if(event.key==='Enter')doLogin()" placeholder="รหัสผ่าน"></div>
      <div id="pwErr" style="color:#f87171;font-size:12px;margin-bottom:8px;display:none">รหัสผ่านไม่ถูกต้อง</div>
      <button class="btn btn-p" style="width:100%;margin-bottom:12px" onclick="doLogin()">เข้าสู่ระบบ Admin</button>
      <div style="text-align:center;color:#aaa;font-size:12px;margin-bottom:10px">— หรือ —</div>
      <button class="btn-fb" onclick="loginFacebook()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        เข้าสู่ระบบด้วย Facebook
      </button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="ov" id="ovDetail" onclick="if(event.target===this)closeDetail()">
  <div class="md">
    <div class="md-h"><h3 id="dTitle">รายละเอียด</h3><button class="md-cl" onclick="closeDetail()">×</button></div>
    <div class="md-b">
      <div style="display:flex;gap:14px;margin-bottom:16px">
        <div id="dPoster" style="flex-shrink:0;width:104px;height:139px;border-radius:10px;overflow:hidden"></div>
        <div style="flex:1;min-width:0">
          <div id="dName" style="font-weight:700;font-size:16px;color:#1a1a1a;margin-bottom:4px"></div>
          <span id="dBadge" style="font-size:11px;padding:2px 10px;border-radius:20px;background:#f3f0fa;color:#7B2FF7;display:inline-block;margin-bottom:8px"></span>
          <div id="dAge" style="color:#666;font-size:12px;margin-bottom:4px"></div>
          <div id="dProv" style="color:#666;font-size:12px;margin-bottom:4px"></div>
          <div id="dOcc" style="color:#666;font-size:12px"></div>
        </div>
      </div>
      <div id="dBio" style="color:#333;font-size:13px;line-height:1.6;background:#f3f0fa;border-radius:10px;padding:10px 12px;margin-bottom:12px;display:none"></div>
      <div style="display:flex;gap:10px;margin-bottom:10px" id="dQR"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap" id="dExtras"></div>
      <div id="dAdminBtns" style="display:none;margin-top:12px">
        <a id="dFbLink" href="#" target="_blank" rel="noopener" style="display:none;align-items:center;gap:6px;background:#1877F2;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;margin-bottom:10px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          ดูโปรไฟล์ Facebook
        </a>
        <div style="display:flex;gap:8px">
          <button class="btn btn-p" style="flex:1" onclick="editCurrent()">✏️ แก้ไข</button>
          <button class="btn btn-d" style="flex:1" onclick="deleteCurrent()">🗑 ลบ</button>
        </div>
      </div>
      <!-- ปุ่มแก้ไขสำหรับสมาชิก (เฉพาะโปรไฟล์ตัวเอง) -->
      <div id="dMemberBtns" style="display:none;margin-top:12px">
        <button class="btn btn-p" style="width:100%" onclick="editCurrent()">✏️ แก้ไขโปรไฟล์ของฉัน</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="ov" id="ovEdit" onclick="if(event.target===this)closeEdit()">
  <div class="md">
    <div class="md-h"><h3 id="editTitle">แก้ไขสมาชิก</h3><button class="md-cl" onclick="closeEdit()">×</button></div>
    <div class="md-b">
      <div class="fgr full" style="margin-bottom:12px">
        <label>รูปโปรไฟล์ (3:4)</label>
        <div class="pu">
          <div class="pu-ph" id="puPh">📷</div>
          <img id="puImg" class="pu-img" style="display:none">
          <div style="font-size:12px;color:#7B2FF7;margin-top:4px" id="puHint">คลิกเพื่ออัปโหลด</div>
          <input type="file" accept="image/*" onchange="upMain(this)">
        </div>
      </div>
      <div class="fgr full" style="margin-bottom:12px">
        <label>รูปเพิ่มเติม (3 รูป)</label>
        <div class="xg">
          <div class="xs" id="x0"><span style="font-size:18px;color:#7B2FF7">+</span><span style="font-size:10px;color:#7B2FF7">รูป 1</span><input type="file" accept="image/*" onchange="upExtra(this,0)"><button class="xs-rm" onclick="rmX(event,0)">×</button></div>
          <div class="xs" id="x1"><span style="font-size:18px;color:#7B2FF7">+</span><span style="font-size:10px;color:#7B2FF7">รูป 2</span><input type="file" accept="image/*" onchange="upExtra(this,1)"><button class="xs-rm" onclick="rmX(event,1)">×</button></div>
          <div class="xs" id="x2"><span style="font-size:18px;color:#7B2FF7">+</span><span style="font-size:10px;color:#7B2FF7">รูป 3</span><input type="file" accept="image/*" onchange="upExtra(this,2)"><button class="xs-rm" onclick="rmX(event,2)">×</button></div>
        </div>
      </div>
      <div class="fg">
        <div class="fgr"><label>ชื่อ</label><input type="text" id="fnm"></div>
        <div class="fgr"><label>ชื่อภาษาอังกฤษ</label><input type="text" id="fne"></div>
        <div class="fgr"><label>อายุ</label><input type="text" id="fag"></div>
        <div class="fgr"><label>จังหวัด</label><input type="text" id="fpv"></div>
        <div class="fgr full"><label>อาชีพ</label><input type="text" id="foc"></div>
        <div class="fgr"><label>WhatsApp</label><input type="tel" id="fwa"></div>
        <div class="fgr"><label>LINE ID</label><input type="text" id="fli"></div>
        <div class="fgr full" id="fbRow"><label>🔗 Facebook URL (เฉพาะแอดมิน)</label><input type="text" id="ffb" placeholder="https://www.facebook.com/..."></div>
        <div class="fgr full" id="tierRow">
          <label>ระดับสมาชิก (เฉพาะแอดมิน)</label>
          <div class="tr-g">
            <div class="tr-o" onclick="setTier('Promoted')">Promoted</div>
            <div class="tr-o" onclick="setTier('VIP')">VIP</div>
            <div class="tr-o" onclick="setTier('Premium')">Premium</div>
            <div class="tr-o" onclick="setTier('Member')">Member</div>
          </div>
        </div>
        <div class="fgr full"><label>Bio</label><textarea id="fbi" rows="2"></textarea></div>
      </div>
    </div>
    <div class="md-f">
      <button class="btn btn-d btn-s" id="btnDelM" onclick="deleteCurrent()" style="margin-right:auto;display:none">ลบ</button>
      <button class="btn btn-g" onclick="closeEdit()">ยกเลิก</button>
      <button class="btn btn-p" onclick="saveM()">💾 บันทึก</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ======================================================
// CONFIG
// ======================================================
const SUPABASE_URL = 'https://moscyihmqkbtzqnjhtlq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_pKl3YTH_FLlgUMSKymnPLA_MkqJJw4K';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const APW = 'mmr2024'; // Admin password
const CL  = 'dwaoxzaza';
const CP  = 'kmgtl0tf';

var TIER_CONF = {
  Promoted:{tag:'Promoted',c1:'promoted-1',c2:'promoted-2',ratio:147/110,fi:42,fn:11,fs:9,fp:8,fo:7},
  VIP:     {tag:'VIP',     c1:'vip-1',    c2:'vip-2',    ratio:70/90, fi:26,fn:10,fs:8,fp:7,fo:5,dark:true},
  Premium: {tag:'Premium', c1:'premium-1',c2:'premium-2',ratio:100/75,fi:24,fn:10,fs:8,fp:5,fo:4},
  Member:  {tag:'Member',  c1:'member-1', c2:'member-2', ratio:83/62, fi:18,fn:9, fs:7,fp:4,fo:3}
};

var all=[], filt='', isAdmin=false, isMember=false, currentUser=null, curId=null, eid=null, photo='', extras=['','',''];

// ======================================================
// SUPABASE AUTH
// ======================================================
sb.auth.onAuthStateChange(async function(event, session) {
  if (session && session.user) {
    currentUser = session.user;
    isMember = true;
    var name = session.user.user_metadata.full_name || session.user.user_metadata.name || 'สมาชิก';
    document.getElementById('memberName').textContent = name;
    document.getElementById('memberBadge').style.display = 'inline-flex';
    document.getElementById('btnLogout').style.display = 'inline-block';
    document.getElementById('btnLoginFB').style.display = 'none';
    document.getElementById('ovLogin').className = 'ov';

    // ตรวจสอบว่ามี profile ใน old_members ไหม เพื่อ match ข้อมูล
    await matchOldMember(session.user);
  } else {
    currentUser = null;
    isMember = false;
    document.getElementById('memberBadge').style.display = 'none';
    document.getElementById('btnLogout').style.display = 'none';
    if (!isAdmin) document.getElementById('btnLoginFB').style.display = 'inline-block';
  }
  draw();
});

async function matchOldMember(user) {
  try {
    // ตรวจสอบว่า profile มีข้อมูลครบหรือยัง
    var { data: profile } = await sb.from('profiles').select('full_name').eq('id', user.id).single();
    if (profile && profile.full_name) return; // มีข้อมูลแล้ว

    // หา facebook URL ของ user นี้ใน old_members
    var fbUrl = user.user_metadata.full_name;
    var { data: old } = await sb.from('old_members')
      .select('*')
      .is('matched_user_id', null)
      .limit(1);

    // ถ้าเจอ ให้ copy ข้อมูลเข้า profiles
    if (old && old.length > 0) {
      var m = old[0];
      await sb.from('profiles').update({
        full_name:  m.name || user.user_metadata.full_name,
        phone:      m.whatsapp || '',
        line_id:    m.line_id || '',
        avatar_url: m.photo_url || user.user_metadata.avatar_url || '',
        tier:       m.tier || 'VIP',
      }).eq('id', user.id);

      // mark ว่า matched แล้ว
      await sb.from('old_members').update({ matched_user_id: user.id }).eq('id', m.id);
    } else {
      // ไม่เจอใน old_members → ใช้ข้อมูลจาก Facebook
      await sb.from('profiles').update({
        full_name:  user.user_metadata.full_name || '',
        avatar_url: user.user_metadata.avatar_url || '',
        tier:       'VIP',
      }).eq('id', user.id);
    }
  } catch(e) {
    console.log('matchOldMember error:', e);
  }
}

// ======================================================
// LOAD DATA จาก old_members (ข้อมูลเก่า) + profiles (ใหม่)
// ======================================================
async function load() {
  try {
    // ดึงจาก old_members ก่อน (ข้อมูลเก่าทั้งหมด)
    var { data: oldData } = await sb.from('old_members').select('*').order('sort_order');

    // ดึง profiles ที่ login แล้ว (สมาชิกใหม่)
    var { data: newData } = await sb.from('profiles').select('*').eq('is_active', true);

    all = [];

    // แปลง old_members เป็น format เดียวกัน
    if (oldData) {
      oldData.forEach(function(m) {
        all.push({
          _id:        m.id,
          _source:    'old',
          id:         m.member_id,
          name:       m.name,
          nameEn:     m.name_en,
          age:        m.age,
          province:   m.province,
          occupation: m.occupation,
          whatsapp:   m.whatsapp,
          lineId:     m.line_id,
          facebook:   m.facebook_url,
          tier:       m.tier || 'Member',
          bio:        m.bio,
          photo:      m.photo_url,
          extras:     m.extras || [],
          order:      m.sort_order,
          matched_user_id: m.matched_user_id,
        });
      });
    }

    // เพิ่มสมาชิกใหม่ที่ยังไม่มีใน old_members
    if (newData) {
      newData.forEach(function(p) {
        var alreadyIn = all.find(function(m) { return m.matched_user_id === p.id; });
        if (!alreadyIn && p.full_name) {
          all.push({
            _id:      p.id,
            _source:  'new',
            id:       '',
            name:     p.full_name,
            nameEn:   '',
            age:      '',
            province: '',
            tier:     p.tier || 'VIP',
            bio:      '',
            photo:    p.avatar_url,
            extras:   [],
            order:    9999,
          });
        }
      });
    }

    // เรียงลำดับ
    all.sort(function(a,b) { return (a.order||0)-(b.order||0); });

  } catch(e) {
    console.error('load error:', e);
    all = [];
  }

  document.getElementById('cntLbl').textContent = all.length + ' สมาชิก';
  draw();
}

window.doReload = function() { load(); };

// ======================================================
// RENDER
// ======================================================
function getContainerWidth(){
  var el=document.getElementById('mainContainer');
  return el ? el.clientWidth-36 : (window.innerWidth-36);
}
function calcSizes(promotedCount){
  var W=getContainerWidth(),GAP=7;
  var n=promotedCount||10;
  var promotedCols=W<=480?3:Math.min(Math.floor((W+GAP)/(100+GAP)),n);
  var promotedW=Math.floor((W-GAP*(promotedCols-1))/promotedCols);
  var promotedH=Math.round(promotedW*TIER_CONF.Promoted.ratio);
  var premCols=W<=480?4:11; var premW=Math.floor((W-GAP*(premCols-1))/premCols); var premH=Math.round(premW*TIER_CONF.Premium.ratio);
  var vipCols=W<=480?4:13;  var vipW=Math.floor((W-GAP*(vipCols-1))/vipCols);   var vipH=Math.round(vipW*TIER_CONF.VIP.ratio);
  var memCols=W<=480?5:16;  var memW=Math.floor((W-GAP*(memCols-1))/memCols);   var memH=Math.round(memW*TIER_CONF.Member.ratio);
  function sf(b,bW,w){return Math.max(6,Math.round(b*w/bW));}
  return {
    promoted:{w:promotedW,h:promotedH,cols:promotedCols,fi:sf(42,110,promotedW),fn:sf(11,110,promotedW),fs:sf(9,110,promotedW),fp:sf(8,110,promotedW),fo:sf(7,110,promotedW)},
    vip:     {w:vipW,h:vipH,fi:sf(26,90,vipW),fn:sf(10,90,vipW),fs:sf(8,90,vipW),fp:sf(7,90,vipW),fo:sf(5,90,vipW)},
    premium: {w:premW,h:premH,fi:sf(24,75,premW),fn:sf(10,75,premW),fs:sf(8,75,premW),fp:sf(5,75,premW),fo:sf(4,75,premW)},
    member:  {w:memW,h:memH,fi:sf(18,62,memW),fn:sf(9,62,memW),fs:sf(7,62,memW),fp:sf(4,62,memW),fo:sf(3,62,memW)}
  };
}
var COLORS=['#ddd6fe','#bfdbfe','#bbf7d0','#fde68a','#fecaca','#fbcfe8'];
function ini(n){return ((n||'').trim().split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2))||'?';}

function makeCard(m,tc,sz,idx){
  var colorClass=idx%2===0?tc.c1:tc.c2;
  var iniClass=tc.dark?'card-initial dark':'card-initial';
  var br=sz.h>100?10:8;
  var isOwn=isMember&&currentUser&&m.matched_user_id===currentUser.id;
  var html='<div class="card '+colorClass+'" onclick="openDetail(\''+m._id+'\')" style="width:'+sz.w+'px;height:'+sz.h+'px;border-radius:'+br+'px">';
  if(isAdmin||isOwn) html+='<button class="card-edit" style="display:block" onclick="event.stopPropagation();openEdit(\''+m._id+'\')">✏️</button>';
  var tagExtra=(m.tier==='Promoted')?' tier-tag-promoted':'';
  html+='<div class="tier-tag'+tagExtra+'" style="font-size:'+sz.fp+'px">'+tc.tag+'</div>';
  if(m.photo) html+='<img src="'+m.photo+'">';
  else html+='<div class="'+iniClass+'" style="font-size:'+sz.fi+'px;position:relative;z-index:1">'+ini(m.name)+'</div>';
  html+='<div class="overlay" style="padding:'+sz.fo+'px">';
  html+='<div class="card-name" style="font-size:'+sz.fn+'px">'+(m.name||'')+'</div>';
  if(m.nameEn) html+='<div class="card-sub" style="font-size:'+sz.fs+'px">'+m.nameEn+'</div>';
  else if(m.province) html+='<div class="card-sub" style="font-size:'+sz.fs+'px">'+m.province+'</div>';
  html+='</div></div>';
  return html;
}

window.draw=function(){
  var q=(document.getElementById('sq').value||'').toLowerCase();
  var list=all.filter(function(m){
    var ok=!q||[m.name,m.province,m.occupation,m.bio].some(function(v){return (v||'').toLowerCase().indexOf(q)>=0;});
    return ok&&(!filt||m.tier===filt);
  });
  var groups={Promoted:[],VIP:[],Premium:[],Member:[]};
  list.forEach(function(m){var t=m.tier||'Member';if(groups[t])groups[t].push(m);else groups.Member.push(m);});
  var c=document.getElementById('mainContainer');
  if(!list.length){c.innerHTML='<div class="empty">ไม่พบสมาชิก</div>';return;}
  var SZ=calcSizes(groups.Promoted.length);
  var html='';
  ['Promoted','Premium','VIP','Member'].forEach(function(tier){
    if(!groups[tier].length) return;
    var tc=TIER_CONF[tier];
    var sz=SZ[tier.toLowerCase()];
    html+='<div class="tier-section"><div class="row-tier">';
    groups[tier].forEach(function(m,i){html+=makeCard(m,tc,sz,i);});
    html+='</div></div>';
  });
  c.innerHTML=html;
};

// ======================================================
// UPLOAD รูป (Cloudinary เหมือนเดิม)
// ======================================================
async function upCloud(f){
  var fd=new FormData();fd.append('file',f);fd.append('upload_preset',CP);
  var r=await fetch('https://api.cloudinary.com/v1_1/'+CL+'/image/upload',{method:'POST',body:fd});
  return (await r.json()).secure_url;
}
window.upMain=async function(input){
  var f=input.files[0];if(!f)return;
  document.getElementById('puHint').textContent='กำลังอัปโหลด...';
  try{photo=await upCloud(f);document.getElementById('puImg').src=photo;document.getElementById('puImg').style.display='block';document.getElementById('puPh').style.display='none';document.getElementById('puHint').textContent='✓ สำเร็จ';toast('อัปโหลดสำเร็จ','ok');}
  catch(e){toast('อัปโหลดไม่สำเร็จ','er');}
};
window.upExtra=async function(input,i){
  var f=input.files[0];if(!f)return;
  try{var url=await upCloud(f);extras[i]=url;var sl=document.getElementById('x'+i);sl.innerHTML='<img src="'+url+'"><button class="xs-rm" onclick="rmX(event,'+i+')">×</button><input type="file" accept="image/*" onchange="upExtra(this,'+i+')" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">';toast('รูปที่'+(i+1)+' สำเร็จ','ok');}
  catch(e){toast('อัปโหลดไม่สำเร็จ','er');}
};
window.rmX=function(e,i){e.stopPropagation();extras[i]='';var sl=document.getElementById('x'+i);sl.innerHTML='<span style="font-size:18px;color:#7B2FF7">+</span><span style="font-size:10px;color:#7B2FF7">รูป'+(i+1)+'</span><input type="file" accept="image/*" onchange="upExtra(this,'+i+')"><button class="xs-rm" onclick="rmX(event,'+i+')">×</button>';};
function resetX(){for(var i=0;i<3;i++){(function(i){var sl=document.getElementById('x'+i);if(extras[i])sl.innerHTML='<img src="'+extras[i]+'"><button class="xs-rm" onclick="rmX(event,'+i+')">×</button><input type="file" accept="image/*" onchange="upExtra(this,'+i+')" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">';else sl.innerHTML='<span style="font-size:18px;color:#7B2FF7">+</span><span style="font-size:10px;color:#7B2FF7">รูป'+(i+1)+'</span><input type="file" accept="image/*" onchange="upExtra(this,'+i+')"><button class="xs-rm" onclick="rmX(event,'+i+')">×</button>';})(i);}}

// SAVE
// ======================================================
window.saveM=async function(){
  var m=all.find(function(x){return x._id===eid;});
  var isOwn=isMember&&currentUser&&m&&m.matched_user_id===currentUser.id;
  if(!isAdmin&&!isOwn){toast('ไม่มีสิทธิ์','er');return;}

  var data={
    name:       document.getElementById('fnm').value.trim(),
    name_en:    document.getElementById('fne').value.trim(),
    age:        document.getElementById('fag').value.trim(),
    province:   document.getElementById('fpv').value.trim(),
    occupation: document.getElementById('foc').value.trim(),
    whatsapp:   document.getElementById('fwa').value.trim(),
    line_id:    document.getElementById('fli').value.trim(),
    photo_url:  photo,
    extras:     extras,
    bio:        document.getElementById('fbi').value.trim(),
  };

  if(isAdmin) {
    data.facebook_url = document.getElementById('ffb').value.trim();
    data.tier = window._tier || 'Member';
  }

  try{
    if(eid && m) {
      if(m._source === 'old') {
        // update old_members
        var {error} = await sb.from('old_members').update(data).eq('id', eid);
        if(error) throw error;
      } else {
        // update profiles
        await sb.from('profiles').update({
          full_name:  data.name,
          phone:      data.whatsapp,
          line_id:    data.line_id,
          avatar_url: data.photo_url,
        }).eq('id', eid);
      }
      // update local
      Object.assign(m, {name:data.name,nameEn:data.name_en,age:data.age,province:data.province,occupation:data.occupation,whatsapp:data.whatsapp,lineId:data.line_id,photo:data.photo_url,extras:data.extras,bio:data.bio});
      if(isAdmin){m.facebook=data.facebook_url;m.tier=data.tier;}
    } else if(isAdmin) {
      // Admin เพิ่มสมาชิกใหม่ใน old_members
      var newData = Object.assign(data, {
        facebook_url: document.getElementById('ffb').value.trim(),
        tier: window._tier||'Member',
        sort_order: all.length,
      });
      var {data:inserted, error} = await sb.from('old_members').insert(newData).select().single();
      if(error) throw error;
      all.push({_id:inserted.id,_source:'old',name:data.name,nameEn:data.name_en,age:data.age,province:data.province,occupation:data.occupation,whatsapp:data.whatsapp,lineId:data.line_id,facebook:data.facebook_url,tier:data.tier||'Member',bio:data.bio,photo:data.photo_url,extras:data.extras,order:all.length});
    }
    draw();closeEdit();toast('บันทึกสำเร็จ','ok');
  }catch(e){toast('บันทึกไม่สำเร็จ: '+e.message,'er');}
};

window.deleteCurrent=async function(){
  if(!isAdmin){toast('เฉพาะ Admin เท่านั้น','er');return;}
  var id=curId||eid; if(!id)return;
  var m=all.find(function(x){return x._id===id;});
  if(!confirm('ลบ '+(m?m.name:id)+'?'))return;
  try{
    if(m&&m._source==='old') await sb.from('old_members').delete().eq('id',id);
    all=all.filter(function(x){return x._id!==id;});
    draw();closeDetail();closeEdit();toast('ลบสำเร็จ','ok');
  }catch(e){toast('ลบไม่สำเร็จ','er');}
};

window.toast=function(msg,type){var el=document.getElementById('toast');el.textContent=msg;el.className='toast on'+(type?' '+type:'');setTimeout(function(){el.className='toast';},3000);};
